# ==============================================================================
# Frontend Nginx Configuration (`frontend/nginx.conf`)
# - Serves React 19 + Three.js + @pixiv/three-vrm SPA (`try_files`)
# - Proxies `/api/` REST calls to FastAPI backend
# - Upgrades `/ws/interview/` connections to Hybrid WebSocket (`opcode 0x01/0x02`)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security & MIME headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for JS, CSS, JSON, and VRM/GLTF assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        model/gltf-binary
        application/octet-stream;

    # 1. REST API Reverse Proxy (`/api/v1/...` -> `http://backend:8000/api/v1/...`)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 2. Hybrid WebSocket Relay Proxy (`/ws/interview/{session_id}`)
    # Supports 60-minute continuous full-duplex 16kHz/24kHz PCM streaming
    location /ws/interview/ {
        proxy_pass http://backend:8000/ws/interview/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. Static Assets & VRM Models Cache Policy
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|vrm|glb)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 4. React Router SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
